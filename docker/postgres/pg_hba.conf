# Who may connect to PostgreSQL, and how (docs/postgres-hardening.md). The server is told to use THIS file
# (-c hba_file=...), so the file inside the data volume is ignored. The first matching line wins.
#
# TYPE  DATABASE  USER                  ADDRESS  METHOD
# Inside the container only (docker exec): the same trust the official image already gives. Whoever can run docker
# exec on this container can already read its secrets, so a password here would add nothing.
local   all       all                            trust
# The superuser can never log in over the network, whatever its password.
host    all       rag_bootstrap         all      reject
# The application and the migrations: their own database only, with a SCRAM-SHA-256 password.
host    rag       rag_app,rag_migrator  all      scram-sha-256
# Everyone else (the old `rag` user, replication, other databases): refused.
host    all       all                   all      reject
