name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      # Unit tests need no models: only the light dependencies are installed (no Docling / torch).
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
