name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-dev.txt
      # Unit tests need no models: only the light dependencies are installed (no Docling / torch).
      - run: pip install -r requirements-core.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
